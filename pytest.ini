[pytest]
testpaths = tests/unit
python_files = test_*.py
python_classes = *Test *Tests Test*
python_functions = test_*
addopts = -v
norecursedirs = tools/hardware_tests .git __pycache__ node_modules
markers =
    slow: intentionally slow tests (e.g. extensive physics/IK sweeps)
    serial: test must run in one process due to shared/global resources
    simulation: simulation or Digital Twin dependent test
    hardware: physical hardware test; never part of automatic unit regression
